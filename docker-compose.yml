version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: employee360-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=employee360
    volumes:
      - mongo-data:/data/db
    networks:
      - employee360-network

  redis:
    image: redis:7.2-alpine
    container_name: employee360-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - employee360-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: employee360-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/employee360
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - JWT_SECRET=super_secret_employee360_jwt_key_2026_dev_mode
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
      - redis
    networks:
      - employee360-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: employee360-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - employee360-network

volumes:
  mongo-data:
  redis-data:

networks:
  employee360-network:
    driver: bridge
